version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 20
    groups:
      astro:
        patterns: ["astro", "@astrojs*", "astro-icon"]
      icons:
        patterns: ["@iconify*"]
      playwright:
        patterns: ["*playwright*"]
      prettier:
        patterns: ["prettier*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
